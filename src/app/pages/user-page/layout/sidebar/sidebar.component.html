<!-- Desktop Sidebar -->
<aside
  class="hidden lg:flex flex-col fixed left-0 inset-y-0 bg-white dark:bg-[#0F1629]/80 z-20 border-r border-[#F1F5F9] dark:border-[#8B5CF6]/20 dark:backdrop-blur-md transition-[width] duration-300 ease-in-out"
  [class.w-[280px]]="!isCollapsed"
  [class.w-[80px]]="isCollapsed"
>
  <div class="overflow-hidden transition-all duration-300" [ngClass]="isCollapsed ? 'p-2' : 'p-4 lg:p-6'">
    <div class="flex items-center gap-3 mb-10 px-2 min-h-[3rem]">
      <img
        *ngIf="!isCollapsed"
        src="/assets/logo-light.png"
        alt="CareerSeed"
        class="app-logo logo-glow max-w-[160px] h-14 object-contain object-left transition-opacity duration-300"
      />
    </div>
    <nav class="space-y-2">
      <a routerLink="/user/dashboard" routerLinkActive="active-link" class="w-full px-3 py-3 rounded-lg lg:rounded-xl font-medium transition-all text-left block" 
        [ngClass]="{'bg-gradient-to-r from-[#7C3AED] to-[#06B6D4] text-white shadow-lg dark:shadow-neon-soft': rla1.isActive, 'text-slate-600 dark:text-[#A1A1AA] hover:text-slate-900 dark:hover:text-[#22D3EE] hover:bg-slate-50 dark:hover:bg-[#8B5CF6]/10': !rla1.isActive}" #rla1="routerLinkActive">
        <span class="flex items-center" [ngClass]="isCollapsed ? 'justify-center' : 'gap-4'">
          <span class="material-symbols-outlined shrink-0" [class.filled]="rla1.isActive">grid_view</span>
          <span class="whitespace-nowrap text-sm lg:text-base" [class.hidden]="isCollapsed">Dashboard</span>
        </span>
      </a>
      <a routerLink="/user/job-matching" routerLinkActive="active-link" class="w-full px-3 py-3 rounded-lg lg:rounded-xl font-medium transition-all text-left block"
        [ngClass]="{'bg-gradient-to-r from-[#7C3AED] to-[#06B6D4] text-white shadow-lg dark:shadow-neon-soft': rla2.isActive, 'text-slate-600 dark:text-[#A1A1AA] hover:text-slate-900 dark:hover:text-[#22D3EE] hover:bg-slate-50 dark:hover:bg-[#8B5CF6]/10': !rla2.isActive}" #rla2="routerLinkActive">
        <span class="flex items-center" [ngClass]="isCollapsed ? 'justify-center' : 'gap-4'">
          <span class="material-symbols-outlined shrink-0" [class.filled]="rla2.isActive">work</span>
          <span class="whitespace-nowrap text-sm lg:text-base" [class.hidden]="isCollapsed">Job Matching</span>
        </span>
      </a>
      <a routerLink="/user/interview-simulator" routerLinkActive="active-link" class="w-full px-3 py-3 rounded-lg lg:rounded-xl font-medium transition-all text-left block"
        [ngClass]="{'bg-gradient-to-r from-[#7C3AED] to-[#06B6D4] text-white shadow-lg dark:shadow-neon-soft': rla3.isActive, 'text-slate-600 dark:text-[#A1A1AA] hover:text-slate-900 dark:hover:text-[#22D3EE] hover:bg-slate-50 dark:hover:bg-[#8B5CF6]/10': !rla3.isActive}" #rla3="routerLinkActive">
        <span class="flex items-center" [ngClass]="isCollapsed ? 'justify-center' : 'gap-4'">
          <span class="material-symbols-outlined shrink-0" [class.filled]="rla3.isActive">mic</span>
          <span class="whitespace-nowrap text-sm lg:text-base" [class.hidden]="isCollapsed">Interview Simulator</span>
        </span>
      </a>
      <a routerLink="/user/courses-projects" routerLinkActive="active-link" class="w-full px-3 py-3 rounded-lg lg:rounded-xl font-medium transition-all text-left block"
        [ngClass]="{'bg-gradient-to-r from-[#7C3AED] to-[#06B6D4] text-white shadow-lg dark:shadow-neon-soft': rla4.isActive, 'text-slate-600 dark:text-[#A1A1AA] hover:text-slate-900 dark:hover:text-[#22D3EE] hover:bg-slate-50 dark:hover:bg-[#8B5CF6]/10': !rla4.isActive}" #rla4="routerLinkActive">
        <span class="flex items-center" [ngClass]="isCollapsed ? 'justify-center' : 'gap-4'">
          <span class="material-symbols-outlined shrink-0" [class.filled]="rla4.isActive">school</span>
          <span class="whitespace-nowrap text-sm lg:text-base" [class.hidden]="isCollapsed">Courses &amp; Projects</span>
        </span>
      </a>
      <a routerLink="/user/support-feedback" routerLinkActive="active-link" class="w-full px-3 py-3 rounded-lg lg:rounded-xl font-medium transition-all text-left block"
        [ngClass]="{'bg-gradient-to-r from-[#7C3AED] to-[#06B6D4] text-white shadow-lg dark:shadow-neon-soft': rla5.isActive, 'text-slate-600 dark:text-[#A1A1AA] hover:text-slate-900 dark:hover:text-[#22D3EE] hover:bg-slate-50 dark:hover:bg-[#8B5CF6]/10': !rla5.isActive}" #rla5="routerLinkActive">
        <span class="flex items-center" [ngClass]="isCollapsed ? 'justify-center' : 'gap-4'">
          <span class="material-symbols-outlined shrink-0" [class.filled]="rla5.isActive">help</span>
          <span class="whitespace-nowrap text-sm lg:text-base" [class.hidden]="isCollapsed">Support &amp; Feedback</span>
        </span>
      </a>
      <a routerLink="/user/profile" routerLinkActive="active-link" class="w-full px-3 py-3 rounded-lg lg:rounded-xl font-medium transition-all text-left block"
        [ngClass]="{'bg-gradient-to-r from-[#7C3AED] to-[#06B6D4] text-white shadow-lg dark:shadow-neon-soft': rla6.isActive, 'text-slate-600 dark:text-[#A1A1AA] hover:text-slate-900 dark:hover:text-[#22D3EE] hover:bg-slate-50 dark:hover:bg-[#8B5CF6]/10': !rla6.isActive}" #rla6="routerLinkActive">
        <span class="flex items-center" [ngClass]="isCollapsed ? 'justify-center' : 'gap-4'">
          <span class="material-symbols-outlined shrink-0" [class.filled]="rla6.isActive">person</span>
          <span class="whitespace-nowrap text-sm lg:text-base" [class.hidden]="isCollapsed">Profile and Settings</span>
        </span>
      </a>
    </nav>
  </div>
  <div class="mt-auto p-4 border-t border-[#F1F5F9] dark:border-[#8B5CF6]/20">
    <button
      type="button"
      (click)="onToggleCollapse()"
      class="flex items-center px-4 py-3 rounded-lg lg:rounded-xl text-slate-600 dark:text-[#A1A1AA] hover:text-slate-900 dark:hover:text-[#22D3EE] transition-colors text-xs font-bold uppercase tracking-widest w-full hover:bg-slate-50 dark:hover:bg-[#8B5CF6]/10 dark:hover:border dark:hover:border-[#8B5CF6]/30"
      [ngClass]="isCollapsed ? 'justify-center' : 'justify-center lg:justify-start gap-3'"
      [attr.aria-label]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      <span class="material-symbols-outlined text-lg shrink-0" [class.rotate-180]="isCollapsed">menu_open</span>
      <span class="whitespace-nowrap" [class.hidden]="isCollapsed">Collapse Sidebar</span>
    </button>
  </div>
</aside>

<!-- Mobile Sidebar -->
<aside
  *ngIf="isMobileOpen"
  class="fixed inset-0 z-30 lg:hidden bg-white dark:bg-[#0F1629]/95 backdrop-blur-md overflow-auto animate-in"
>
  <div class="p-4">
    <div class="flex items-center justify-between mb-6">
      <img
        src="/assets/logo-light.png"
        alt="CareerSeed"
        class="app-logo logo-glow max-w-[160px] h-12 object-contain object-left"
      />
      <button
        (click)="onCloseMobile()"
        class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
      >
        <span class="material-symbols-outlined text-slate-600 dark:text-slate-300">close</span>
      </button>
    </div>
    <nav class="space-y-2">
      <a routerLink="/user/dashboard" (click)="onCloseMobile()" routerLinkActive="active-link" class="bg-transparent w-full px-4 py-3 rounded-lg font-medium transition-all text-left block"
        [ngClass]="{'bg-gradient-to-r from-[#7C3AED] to-[#06B6D4] text-white': rlam1.isActive, 'text-slate-600 dark:text-[#A1A1AA] hover:bg-slate-50 dark:hover:bg-[#8B5CF6]/10': !rlam1.isActive}" #rlam1="routerLinkActive">
        <span class="flex items-center gap-4">
          <span class="material-symbols-outlined shrink-0" [class.filled]="rlam1.isActive">grid_view</span>
          <span>Dashboard</span>
        </span>
      </a>
      <a routerLink="/user/job-matching" (click)="onCloseMobile()" routerLinkActive="active-link" class="bg-transparent w-full px-4 py-3 rounded-lg font-medium transition-all text-left block"
        [ngClass]="{'bg-gradient-to-r from-[#7C3AED] to-[#06B6D4] text-white': rlam2.isActive, 'text-slate-600 dark:text-[#A1A1AA] hover:bg-slate-50 dark:hover:bg-[#8B5CF6]/10': !rlam2.isActive}" #rlam2="routerLinkActive">
        <span class="flex items-center gap-4">
          <span class="material-symbols-outlined shrink-0" [class.filled]="rlam2.isActive">work</span>
          <span>Job Matching</span>
        </span>
      </a>
      <a routerLink="/user/interview-simulator" (click)="onCloseMobile()" routerLinkActive="active-link" class="bg-transparent w-full px-4 py-3 rounded-lg font-medium transition-all text-left block"
        [ngClass]="{'bg-gradient-to-r from-[#7C3AED] to-[#06B6D4] text-white': rlam3.isActive, 'text-slate-600 dark:text-[#A1A1AA] hover:bg-slate-50 dark:hover:bg-[#8B5CF6]/10': !rlam3.isActive}" #rlam3="routerLinkActive">
        <span class="flex items-center gap-4">
          <span class="material-symbols-outlined shrink-0" [class.filled]="rlam3.isActive">mic</span>
          <span>Interview Simulator</span>
        </span>
      </a>
      <a routerLink="/user/courses-projects" (click)="onCloseMobile()" routerLinkActive="active-link" class="bg-transparent w-full px-4 py-3 rounded-lg font-medium transition-all text-left block"
        [ngClass]="{'bg-gradient-to-r from-[#7C3AED] to-[#06B6D4] text-white': rlam4.isActive, 'text-slate-600 dark:text-[#A1A1AA] hover:bg-slate-50 dark:hover:bg-[#8B5CF6]/10': !rlam4.isActive}" #rlam4="routerLinkActive">
        <span class="flex items-center gap-4">
          <span class="material-symbols-outlined shrink-0" [class.filled]="rlam4.isActive">school</span>
          <span>Courses &amp; Projects</span>
        </span>
      </a>
      <a routerLink="/user/support-feedback" (click)="onCloseMobile()" routerLinkActive="active-link" class="bg-transparent w-full px-4 py-3 rounded-lg font-medium transition-all text-left block"
        [ngClass]="{'bg-gradient-to-r from-[#7C3AED] to-[#06B6D4] text-white': rlam5.isActive, 'text-slate-600 dark:text-[#A1A1AA] hover:bg-slate-50 dark:hover:bg-[#8B5CF6]/10': !rlam5.isActive}" #rlam5="routerLinkActive">
        <span class="flex items-center gap-4">
          <span class="material-symbols-outlined shrink-0" [class.filled]="rlam5.isActive">help</span>
          <span>Support &amp; Feedback</span>
        </span>
      </a>
      <a routerLink="/user/profile" (click)="onCloseMobile()" routerLinkActive="active-link" class="bg-transparent w-full px-4 py-3 rounded-lg font-medium transition-all text-left block"
        [ngClass]="{'bg-gradient-to-r from-[#7C3AED] to-[#06B6D4] text-white': rlam6.isActive, 'text-slate-600 dark:text-[#A1A1AA] hover:bg-slate-50 dark:hover:bg-[#8B5CF6]/10': !rlam6.isActive}" #rlam6="routerLinkActive">
        <span class="flex items-center gap-4">
          <span class="material-symbols-outlined shrink-0" [class.filled]="rlam6.isActive">person</span>
          <span>Profile and Settings</span>
        </span>
      </a>
    </nav>
  </div>
</aside>
